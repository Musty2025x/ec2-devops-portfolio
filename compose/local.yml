# Align build contexts, ports, and environment variables with the upstream sample.
# The upstream sample is deliberately not bundled; add it under ./sample-app.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]
    restart: unless-stopped

  # Update these paths and commands to match the upstream sample's actual layout.
  api:
    build:
      context: ../sample-app/server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdb}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped

  frontend:
    build:
      context: ../sample-app/client
    ports:
      - "8080:80"
    depends_on: [api]
    networks: [appnet]
    restart: unless-stopped

volumes:
  postgres_data:
networks:
  appnet:
